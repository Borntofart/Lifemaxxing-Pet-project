<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opret bruger | Lifemaxxing</title>
    <link rel="stylesheet" th:href="@{/css/loginScreen.css}">
</head>
<body>
<div class="background"></div>

<div class="login-box">
    <div class="logo">LIFE<span>MAXXING</span></div>
    <p class="subtitle">Opret en bruger og kom i gang</p>

    <div class="message error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/register}" th:object="${form}" method="post">
        <div class="input-group">
            <label for="username">Brugernavn</label>
            <input type="text" id="username" name="username" th:value="*{username}" placeholder="3-20 tegn"
                   th:classappend="${errorField == 'username'} ? 'invalid'">
        </div>

        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" th:value="*{email}" placeholder="dig@eksempel.dk"
                   th:classappend="${errorField == 'email'} ? 'invalid'">
        </div>

        <!-- Kodeord fyldes ikke ud igen efter fejl -->
        <div class="input-group">
            <label for="password">Kodeord</label>
            <input type="password" id="password" name="password" placeholder="Mindst 6 tegn og ét tal"
                   th:classappend="${errorField == 'password'} ? 'invalid'">
        </div>

        <div class="input-group">
            <label for="password2">Gentag kodeord</label>
            <input type="password" id="password2" name="password2" placeholder="Skriv kodeordet igen"
                   th:classappend="${errorField == 'password2'} ? 'invalid'">
        </div>

        <button type="submit">Opret bruger</button>
    </form>

    <p class="register">
        Har du allerede en bruger? <a th:href="@{/login}">Log ind</a>
    </p>
</div>
</body>
</html>
